<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Printers Live Status Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base: #0a0e17;
    --bg-panel: #0f1526;
    --bg-panel-2: #131b30;
    --line: rgba(255,255,255,0.06);
    --text-primary: #e8eefb;
    --text-muted: #6f7c96;
    --text-dim: #4a566f;
    --cyan: #38bdf8;
    --busy: #ef4444;
    --busy-soft: rgba(239,68,68,0.14);
    --free: #10b981;
    --free-soft: rgba(16,185,129,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    overflow-x:hidden;
  }

  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(56,189,248,0.10), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(16,185,129,0.08), transparent 55%),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: auto, auto, 48px 48px, 48px 48px;
    background-position: 0 0, 0 0, -1px -1px, -1px -1px;
    min-height:100vh;
    padding: clamp(18px, 2.4vw, 40px);
  }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
  }

  /* ---------- HEADER ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 18px;
    padding-bottom: clamp(16px, 2vw, 26px);
    border-bottom: 1px solid var(--line);
    margin-bottom: clamp(18px, 2.2vw, 30px);
  }

  .header-left{
    display:flex;
    align-items:center;
    gap: 16px;
  }

  .led-dot{
    width: 14px; height:14px;
    border-radius:50%;
    background: var(--free);
    box-shadow: 0 0 8px 2px rgba(16,185,129,0.9), 0 0 22px 6px rgba(16,185,129,0.5);
    animation: pulse-led 2s ease-in-out infinite;
    flex-shrink:0;
  }

  @keyframes pulse-led{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.45; transform:scale(0.78); }
  }

  h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    letter-spacing: 2.5px;
    font-size: clamp(18px, 2.1vw, 30px);
    background: linear-gradient(90deg, #ffffff 0%, #9fd8ff 60%, #38bdf8 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }

  .conn-label{
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-top:4px;
  }
  .conn-label span{ color: var(--free); font-weight:600; }

  .header-right{
    text-align:right;
  }

  .clock{
    font-family:'Orbitron', sans-serif;
    font-size: clamp(22px, 3vw, 36px);
    font-weight:700;
    letter-spacing: 2px;
    color:#fff;
    text-shadow: 0 0 18px rgba(56,189,248,0.45);
    line-height:1;
  }

  .date{
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 6px;
  }

  /* ---------- SUMMARY BAR ---------- */
  .summary-bar{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 1.6vw, 20px);
    margin-bottom: clamp(18px, 2.2vw, 28px);
  }

  .metric-card{
    background: linear-gradient(160deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(14px, 1.6vw, 22px) clamp(16px, 2vw, 26px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
  }

  .metric-card .m-label{
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform:uppercase;
  }

  .metric-card .m-value{
    font-family:'Orbitron', sans-serif;
    font-size: clamp(28px, 3.4vw, 42px);
    font-weight:700;
    line-height:1;
    margin-top: 6px;
  }

  .metric-card.total .m-value{ color:#fff; }
  .metric-card.free .m-value{ color: var(--free); text-shadow: 0 0 16px rgba(16,185,129,0.5); }
  .metric-card.busy .m-value{ color: var(--busy); text-shadow: 0 0 16px rgba(239,68,68,0.5); }

  .metric-icon{
    width: 40px; height:40px;
    opacity:.5;
    flex-shrink:0;
  }

  /* ---------- SYNC BANNER ---------- */
  .sync-banner{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:.5px;
    color: var(--text-muted);
    margin-bottom: clamp(14px, 1.8vw, 22px);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px dashed var(--line);
    background: rgba(255,255,255,0.015);
  }
  .sync-banner.warn{
    color: #fbbf24;
    border-color: rgba(251,191,36,0.35);
    background: rgba(251,191,36,0.06);
  }
  .sync-banner b{ color: var(--text-primary); }

  /* ---------- PRINTER GRID ---------- */
  .printer-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(16px, 1.8vw, 26px);
  }

  .printer-card{
    --status-color: var(--free);
    --status-soft: var(--free-soft);
    --status-border: rgba(16,185,129,0.5);
    position:relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 18px;
    border: 1px solid var(--status-border);
    padding: clamp(18px, 1.8vw, 24px);
    box-shadow:
      0 10px 30px rgba(0,0,0,0.45),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 0 26px -6px var(--status-color);
    transition: border-color .5s ease, box-shadow .5s ease, transform .25s ease;
    overflow:hidden;
  }

  .printer-card:hover{
    transform: translateY(-4px);
    box-shadow:
      0 16px 40px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 0 40px -6px var(--status-color);
  }

  .printer-card::before, .printer-card::after{
    content:"";
    position:absolute;
    width: 22px; height:22px;
    border-color: var(--status-color);
    opacity: .9;
    transition: border-color .5s ease;
  }
  .printer-card::before{
    top:10px; left:10px;
    border-top:2px solid var(--status-color);
    border-left:2px solid var(--status-color);
    border-top-left-radius: 6px;
  }
  .printer-card::after{
    bottom:10px; right:10px;
    border-bottom:2px solid var(--status-color);
    border-right:2px solid var(--status-color);
    border-bottom-right-radius: 6px;
  }

  .printer-card.busy{ --status-color: var(--busy); --status-soft: var(--busy-soft); --status-border: rgba(239,68,68,0.55); }
  .printer-card.free{ --status-color: var(--free); --status-soft: var(--free-soft); --status-border: rgba(16,185,129,0.55); }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 14px;
  }

  .printer-id{
    font-family:'Orbitron', sans-serif;
    font-size: clamp(24px, 2.6vw, 32px);
    font-weight:800;
    letter-spacing: 1px;
    color:#fff;
  }

  .printer-sub{
    font-size: 10.5px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .printer-icon{
    width: 46px;
    height: 46px;
    flex-shrink:0;
    color: var(--status-color);
    filter: drop-shadow(0 0 6px var(--status-color));
  }

  .extruder{
    animation: none;
  }
  .printer-card.busy .extruder{
    animation: extrude 1.6s ease-in-out infinite;
  }
  @keyframes extrude{
    0%,100%{ transform: translateX(-6px); }
    50%{ transform: translateX(6px); }
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size: 11.5px;
    font-weight:700;
    letter-spacing: 1.2px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
    background: var(--status-soft);
    color: var(--status-color);
    border: 1px solid var(--status-border);
  }
  .badge .dot{
    width:6px; height:6px; border-radius:50%;
    background: currentColor;
  }
  .printer-card.busy .badge .dot{ animation: pulse-led 1.4s ease-in-out infinite; }

  .info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .info-row:last-of-type{ border-bottom:none; }

  .info-label{
    color: var(--text-muted);
    letter-spacing: .5px;
    font-size: 11px;
    text-transform:uppercase;
  }

  .info-value{
    color: var(--text-primary);
    font-weight:600;
    text-align:right;
  }
  .printer-card.busy .info-value.highlight{ color: var(--busy); }
  .printer-card.free .info-value.highlight{ color: var(--free); }

  .after-strip{
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 12px;
  }
  .after-strip .a-label{ color: var(--text-dim); letter-spacing: 1px; font-size:10.5px; text-transform:uppercase; }
  .after-strip .a-value{ color: var(--cyan); font-weight:700; }

  .scan-stripe{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(239,68,68,0.12) 0px,
      rgba(239,68,68,0.12) 10px,
      transparent 10px,
      transparent 20px
    );
    background-size: 200% 200%;
    transition: opacity .5s ease;
  }
  .printer-card.busy .scan-stripe{
    opacity:1;
    animation: stripe-move 6s linear infinite;
  }
  @keyframes stripe-move{
    0%{ background-position: 0 0; }
    100%{ background-position: 200px 200px; }
  }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 30px;
    padding-bottom: 6px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  @media (max-width: 640px){
    .summary-bar{ grid-template-columns: 1fr; }
    .header{ flex-direction:column; align-items:flex-start; }
    .header-right{ text-align:left; }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="led-dot" id="ledDot"></div>
      <div>
        <h1>3D PRINTERS LIVE STATUS DISPLAY</h1>
        <div class="conn-label">CONNECTION: <span id="connText">LIVE</span> &nbsp;·&nbsp; AUTO-REFRESH: 5s</div>
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--:-- --</div>
      <div class="date" id="dateLine">-- --- ----</div>
    </div>
  </header>

  <section class="summary-bar">
    <div class="metric-card total">
      <div>
        <div class="m-label">Total Printers</div>
        <div class="m-value" id="totalCount">7</div>
      </div>
      <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="#8aa0c8" stroke-width="1.6"><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M6 14V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6"/><path d="M9 6V4h6v2"/></svg>
    </div>
    <div class="metric-card free">
      <div>
        <div class="m-label">Currently Free</div>
        <div class="m-value" id="freeCount">0</div>
      </div>
      <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3L15.5 9.5"/></svg>
    </div>
    <div class="metric-card busy">
      <div>
        <div class="m-label">Currently Busy</div>
        <div class="m-value" id="busyCount">0</div>
      </div>
      <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
    </div>
  </section>

  <div class="sync-banner" id="syncBanner">Initializing connection to data source…</div>

  <main class="printer-grid" id="printerGrid"></main>

  <footer>LAST SYNCED <span id="lastSynced">—</span> &nbsp;·&nbsp; SHOP FLOOR DISPLAY v1.0</footer>

<script>
/* ============================================================
   3D PRINTER LIVE STATUS DASHBOARD
   ============================================================
   SETUP INSTRUCTIONS:
   1. Open your Google Sheet, then File > Share > Publish to web
      (or set sharing to "Anyone with the link can view").
   2. Copy the Spreadsheet ID from the sheet's URL:
      https://docs.google.com/spreadsheets/d/  >>THIS_PART<<  /edit
   3. Paste it below, replacing YOUR_SPREADSHEET_ID_HERE.
   4. Sheet layout expected (any starting row — rows are auto-detected):
        Column A: Printer name, e.g. "B1".."B7"
        Column B: Booking status -> "Yes" or "No"
        Column C: Booking time / remaining duration, e.g. "1 hours"
        Column D: User name, e.g. "Amit"
        Column E: After-booking slot info, e.g. "5 hours"
   ============================================================ */
const SPREADSHEET_ID = "YOUR_SPREADSHEET_ID_HERE";

const REFRESH_MS = 5000;
const gridEl = document.getElementById('printerGrid');
const syncBanner = document.getElementById('syncBanner');
const connText = document.getElementById('connText');
const ledDot = document.getElementById('ledDot');
const lastSyncedEl = document.getElementById('lastSynced');

// Fallback / preview data so the dashboard never looks broken before setup.
const DEMO_DATA = [
  { name:'B1', booking:'Yes', time:'1 hours',  user:'Amit',  after:'5 hours' },
  { name:'B2', booking:'Yes', time:'10 hours', user:'Kapil', after:'6 hours' },
  { name:'B3', booking:'Yes', time:'5 hours',  user:'Mohit', after:'4 hours' },
  { name:'B4', booking:'No',  time:'1 hours',  user:'Ajay',  after:'4 hours' },
  { name:'B5', booking:'No',  time:'8 hours',  user:'Naima', after:'8 hours' },
  { name:'B6', booking:'Yes', time:'3 hours',  user:'Ravi',  after:'49 hours' },
  { name:'B7', booking:'No',  time:'4 hours',  user:'Rohit', after:'4 hours' },
];

const cardRefs = {}; // printerName -> { el, ...field elements }

function printerIconSVG(){
  return `<svg class="printer-icon" viewBox="0 0 48 48" fill="none">
    <rect x="10" y="6" width="28" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
    <rect x="8" y="30" width="32" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
    <path d="M14 16v6M34 16v6" stroke="currentColor" stroke-width="2"/>
    <rect class="extruder" x="20" y="20" width="8" height="6" rx="1" fill="currentColor"/>
    <path d="M14 30v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4" stroke="currentColor" stroke-width="2"/>
  </svg>`;
}

function buildCard(p){
  const card = document.createElement('article');
  card.className = 'printer-card';
  card.id = `card-${p.name}`;
  card.innerHTML = `
    <div class="scan-stripe"></div>
    <div class="card-top">
      <div>
        <div class="printer-id">${p.name}</div>
        <div class="printer-sub">PRINTER UNIT</div>
      </div>
      ${printerIconSVG()}
    </div>
    <div class="badge"><span class="dot"></span><span class="badge-text">—</span></div>
    <div class="info-row">
      <span class="info-label">User</span>
      <span class="info-value user-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Remaining Time</span>
      <span class="info-value highlight time-value">—</span>
    </div>
    <div class="after-strip">
      <span class="a-label">After Booking</span>
      <span class="a-value after-value">—</span>
    </div>
  `;
  gridEl.appendChild(card);
  cardRefs[p.name] = {
    el: card,
    badgeText: card.querySelector('.badge-text'),
    userValue: card.querySelector('.user-value'),
    timeValue: card.querySelector('.time-value'),
    afterValue: card.querySelector('.after-value'),
  };
}

function updateCard(p){
  const ref = cardRefs[p.name];
  if (!ref) { buildCard(p); return updateCard(p); }

  const isBusy = String(p.booking).trim().toLowerCase() === 'yes';
  ref.el.classList.toggle('busy', isBusy);
  ref.el.classList.toggle('free', !isBusy);

  ref.badgeText.textContent = isBusy ? '● BUSY / WORKING' : '✓ AVAILABLE / FREE';
  ref.userValue.textContent = isBusy ? (p.user || '—') : 'Available for Booking';
  ref.timeValue.textContent = isBusy ? (p.time || '—') : '—';
  ref.afterValue.textContent = p.after || '—';
}

function render(printers){
  printers.forEach(updateCard);

  const busy = printers.filter(p => String(p.booking).trim().toLowerCase() === 'yes').length;
  const free = printers.length - busy;
  document.getElementById('totalCount').textContent = printers.length;
  document.getElementById('freeCount').textContent = free;
  document.getElementById('busyCount').textContent = busy;

  lastSyncedEl.textContent = new Date().toLocaleTimeString('en-US', { hour12: true });
}

function setConnectionState(ok, message){
  ledDot.style.background = ok ? 'var(--free)' : '#fbbf24';
  ledDot.style.boxShadow = ok
    ? '0 0 8px 2px rgba(16,185,129,0.9), 0 0 22px 6px rgba(16,185,129,0.5)'
    : '0 0 8px 2px rgba(251,191,36,0.9), 0 0 22px 6px rgba(251,191,36,0.5)';
  connText.textContent = ok ? 'LIVE' : 'DEMO';
  connText.style.color = ok ? 'var(--free)' : '#fbbf24';

  if (message){
    syncBanner.textContent = message;
    syncBanner.classList.toggle('warn', !ok);
    syncBanner.style.display = 'flex';
  } else {
    syncBanner.style.display = 'none';
  }
}

function parseGvizResponse(text){
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  const json = JSON.parse(text.substring(start, end + 1));
  const rows = (json.table && json.table.rows) || [];

  const printers = [];
  rows.forEach(row => {
    const c = row.c || [];
    const nameCell = c[0];
    if (!nameCell || nameCell.v === null || nameCell.v === undefined) return;
    const name = String(nameCell.v).trim();
    if (!/^B\d+$/i.test(name)) return; // only rows that look like printer IDs (B1, B2, ...)

    printers.push({
      name,
      booking: c[1] && c[1].v != null ? String(c[1].v).trim() : 'No',
      time:    c[2] && c[2].v != null ? String(c[2].v).trim() : '—',
      user:    c[3] && c[3].v != null ? String(c[3].v).trim() : '—',
      after:   c[4] && c[4].v != null ? String(c[4].v).trim() : '—',
    });
  });
  return printers;
}

async function fetchData(){
  if (SPREADSHEET_ID === 'YOUR_SPREADSHEET_ID_HERE'){
    setConnectionState(false, '⚠ No spreadsheet connected — showing demo data. Add your SPREADSHEET_ID in the script (see comments at the top of the JS).');
    render(DEMO_DATA);
    return;
  }

  const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('Network response was not ok');
    const text = await res.text();
    const printers = parseGvizResponse(text);

    if (printers.length === 0) throw new Error('No printer rows found in sheet');

    setConnectionState(true, null);
    render(printers);
  } catch (err) {
    setConnectionState(false, '⚠ Could not reach the Google Sheet — showing demo data. Check that the sheet is published/shared and SPREADSHEET_ID is correct.');
    render(DEMO_DATA);
  }
}

function updateClock(){
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  const date = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('clock').textContent = time;
  document.getElementById('dateLine').textContent = date;
}

// Init
updateClock();
setInterval(updateClock, 1000);

fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
