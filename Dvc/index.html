<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office Status Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d12;
    --panel: #121820;
    --border: #1e2638;
    --text: #f0f4f8;
    --text-dim: #708090;
    --free: #00e676;
    --free-bg: rgba(0,230,118,0.1);
    --busy: #ff5252;
    --busy-bg: rgba(255,82,82,0.1);
    --amber: #ffb300;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  h1 { font-size: 26px; font-weight: 800; }
  .clock { font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: var(--text-dim); }
  
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; font-family: 'IBM Plex Mono', monospace;
  }
  .stat-card .val { font-size: 24px; font-weight: 700; }
  .stat-card .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    flex: 1;
    overflow-y: auto;
  }
  
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.busy { border-color: rgba(255,82,82,0.4); }
  .card.free { border-color: rgba(0,230,118,0.3); }

  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700; }
  .card-type { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }

  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 700; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase;
  }
  .badge.free { background: var(--free-bg); color: var(--free); }
  .badge.busy { background: var(--busy-bg); color: var(--busy); }

  .info-row { display: flex; justify-content: space-between; font-size: 13px; }
  .info-row .label { color: var(--text-dim); }
  .info-row .val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .next-queue {
    margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--amber);
  }
</style>
</head>
<body>

<header>
  <div>
    <div style="font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono';">OFFICE MONITOR</div>
    <h1>Live Equipment & Room Status</h1>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="stats">
  <div class="stat-card"><div class="val" style="color:var(--free)" id="freeNum">0</div><div class="lbl">Available</div></div>
  <div class="stat-card"><div class="val" style="color:var(--busy)" id="busyNum">0</div><div class="lbl">In Use</div></div>
  <div class="stat-card"><div class="val" id="totalNum">0</div><div class="lbl">Total Units</div></div>
</div>

<div class="grid" id="grid">
  <div style="color:var(--text-dim); font-family:'IBM Plex Mono';">Loading live data...</div>
</div>

<script>
  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  }
  setInterval(updateClock, 1000);
  updateClock();

  function fetchData() {
    google.script.run.withSuccessHandler(render).getDashboardData();
  }

  function render(data) {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    var freeCount = 0, busyCount = 0;

    data.forEach(function(item) {
      if(item.status === 'busy') busyCount++; else freeCount++;

      var card = document.createElement('div');
      card.className = 'card ' + item.status;
      
      var content = `
        <div class="card-header">
          <div>
            <div class="card-title">${item.id}</div>
            <div class="card-type">${item.type}</div>
          </div>
          <span class="badge ${item.status}">${item.status === 'busy' ? 'In Use' : 'Free'}</span>
        </div>
      `;

      if(item.status === 'busy') {
        content += `
          <div class="info-row"><span class="label">Booked By</span><span class="val">${item.user}</span></div>
          <div class="info-row"><span class="label">Duration</span><span class="val">${item.time}</span></div>
        `;
      } else {
        content += `<div class="info-row"><span class="label">Status</span><span class="val" style="color:var(--free)">Available Now</span></div>`;
      }

      if(item.after && item.after !== '—') {
        content += `<div class="next-queue">Next: ${item.after} duration</div>`;
      }

      card.innerHTML = content;
      grid.appendChild(card);
    });

    document.getElementById('freeNum').textContent = freeCount;
    document.getElementById('busyNum').textContent = busyCount;
    document.getElementById('totalNum').textContent = data.length;
  }

  fetchData();
  setInterval(fetchData, 5000); // Har 5 second me auto update hoga
</script>

</body>
</html>
